# 量化趋势看板 · Docker Compose
#
# 端口都可通过 .env 覆盖（避免与宿主已有服务冲突）：
#   ENGINE_PORT / BACKEND_PORT / WEB_PORT
#
# 默认复用博客已有的 Redis：
#   backend 的 REDIS_HOST 默认指向 host.docker.internal；
#   若博客 Redis 与本项目在同一 docker 网络（推荐），在
#   docker-compose.override.yml 里把 backend 接到该外部网络，
#   并把 REDIS_HOST 设为博客 Redis 的容器名（如 blog-redis）。
services:
  engine:
    build: ./engine
    container_name: quant-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8000}:8000"

  backend:
    build: ./backend
    container_name: quant-backend
    restart: unless-stopped
    depends_on:
      - engine
    environment:
      QUANT_ENGINE_URL: http://engine:8000
      QUANT_DEFAULT_START: ${QUANT_DEFAULT_START:-2021-01-01}
      QUANT_COST_BPS: ${QUANT_COST_BPS:-10}
      QUANT_CACHE_TTL: ${QUANT_CACHE_TTL:-600}
      QUANT_AUTH_ENABLED: ${QUANT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      # 复用博客 Redis（host.docker.internal 指宿主；同网络则填 redis 容器名）
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  web:
    build: ./web
    container_name: quant-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8090}:80"
